baseURL = "http://localhost:1313/"
title = "Svtter's Blog"
theme = "hugo-theme-inkline"

defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

[languages]
  [languages.zh-cn]
  weight = 1
  [languages.en]
  weight = 2
  title = "Svtter's Blog"

[pagination]
pagerSize = 10

[taxonomies]
series = "series"
tag = "tags"
category = "categories"

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = true
    style = "monokai"
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # 文章内嵌 raw HTML（如 SVG 图表）

[related]
includeNewer = true
toLower = false
threshold = 60
  [[related.indices]]
  name = "tags"
  weight = 80
  [[related.indices]]
  name = "categories"
  weight = 40



# 顶部导航补充项（其余导航来自页面 frontmatter 的 menu 声明）
[[menus.main]]
name = "文章"
pageRef = "/post/"
weight = -100
[[menus.main]]
name = "系列"
pageRef = "/series/"
weight = -99
[[menus.main]]
name = "分类"
pageRef = "/categories/"
weight = -98

[params]
description = "专注于编程技术、机器学习和开发工具。分享实践经验，探索技术的本质，记录学习的旅程。"
motto = "在你想要放弃的时候，想想你为什么开始"
bio = "专注于编程技术、机器学习和开发工具。分享实践经验，探索技术的本质，记录学习的旅程。"
avatar = "https://github.com/Svtter.png"
name = "Svtter"
handle = "@svtter · svtter.cn"
since = 2014
license = "CC BY-NC-SA 4.0"
topics = ["编程", "机器学习", "开发工具", "Agent 工程", "技术写作", "自托管"]

[params.newsletter]
label = "订阅以获取最新文章更新，第一时间送达你的邮箱"
action = ""

[params.github_calendar]
enable = true
username = "svtter"

# [params.carbon]
# serve = "你的 Carbon serve ID"
# placement = "你的 placement ID"

[params.social]
github = "https://github.com/svtter"

[params.utterances]
repo = "Svtter/svtter.github.io"
label = "blog"
mapping = "title"
