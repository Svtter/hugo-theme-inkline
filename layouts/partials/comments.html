{{ with site.Params.utterances.repo }}
<div class="comments">
  <div class="comments-head">{{ i18n "comments_head" (dict "repo" .) }}</div>
  <script src="https://utteranc.es/client.js"
    repo="{{ . }}"
    issue-term="{{ site.Params.utterances.mapping | default "title" }}"
    label="{{ site.Params.utterances.label | default "" }}"
    theme="github-light"
    crossorigin="anonymous"
    async></script>
</div>
{{ end }}
