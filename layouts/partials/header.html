{{ $host := (urls.Parse site.BaseURL).Hostname }}
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="logotype" href="{{ site.Home.RelPermalink }}">
      <span class="path">~/</span>{{ $host }}<span class="cursor"></span>
    </a>
    <nav class="nav">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="top-actions">
      {{ with site.Params.social.github }}
      <a class="icon-btn top-social" href="{{ . }}" target="_blank" rel="noopener" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
      </a>
      {{ end }}
      {{ with site.Home.OutputFormats.Get "rss" }}
      <a class="icon-btn top-social" href="{{ .Permalink }}" title="RSS 订阅">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4.4A15.6 15.6 0 0 1 19.6 20h-3A12.6 12.6 0 0 0 4 7.4v-3zm0 6A9.6 9.6 0 0 1 13.6 20h-3A6.6 6.6 0 0 0 4 13.4v-3zM6.5 20a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      </a>
      {{ end }}
      <button class="icon-btn" id="btn-search" title="搜索（/）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <div class="fs-menu-wrap">
        <button class="icon-btn" id="btn-fontsize" title="字号：小 / 中 / 大"><span class="fs-a">A</span></button>
        <div class="fs-menu" id="fs-menu">
          <button data-fs="s" class="active">小<span class="fs-demo">A</span></button>
          <button data-fs="m">中<span class="fs-demo">A</span></button>
          <button data-fs="l">大<span class="fs-demo">A</span></button>
        </div>
      </div>
      <button class="icon-btn" id="btn-theme" title="切换深浅主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </div>
</header>
